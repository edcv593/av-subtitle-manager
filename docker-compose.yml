services:
  subtitle-manager:
    image: ghcr.io/edcv593/av-subtitle-manager:latest
    container_name: av-subtitle-manager
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      TZ: Asia/Shanghai
      MEDIA_ROOT: /media
      DATA_ROOT: /data
      SCAN_HOURS: "6"
      RETRY_HOURS: "24"
      FILE_STABLE_MINUTES: "30"
      AUTO_DOWNLOAD: "true"
      SKIP_C_MARKER: "true"
      CHECK_EMBEDDED: "true"
      SCORE_THRESHOLD: "80"
      AI_QUEUE_ENABLED: "true"
      AI_AUTO_ENQUEUE: "false"
      AI_WORKER_ENABLED: "false"
      AI_MAX_PENDING: "500"
      AI_SOURCE_LANGUAGE: "ja"
      AI_TARGET_LANGUAGE: "zh"
      MAX_DOWNLOAD_MB: "8"
      WEB_TOKEN: "CHANGE_ME_TO_A_LONG_RANDOM_PASSWORD"
    volumes:
      - /请修改为极空间实际影片路径:/media
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
